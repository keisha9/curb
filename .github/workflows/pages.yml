# Builds the rider trips site only (no ops dashboard) and publishes it to GitHub Pages.
name: Deploy trips site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
        env:
          # The Convex client URL is public by design (it ships in every browser bundle).
          VITE_CONVEX_URL: https://keen-meerkat-598.convex.cloud
          VITE_TRIPS_ONLY: "1"
          BASE_PATH: /project-name/
      # Pages has no SPA rewrites: a real /trips/ page (200), plus 404.html as the fallback.
      - run: mkdir -p dist/trips && cp dist/index.html dist/trips/index.html && cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
